[workspace]
resolver = "3"
members = [
    "crates/nothing-proto",
    "crates/nothing-link",
    "crates/nothing-ctl",
    "crates/nothing-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
nothing-proto = { path = "crates/nothing-proto" }
nothing-link = { path = "crates/nothing-link" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
strip = true
